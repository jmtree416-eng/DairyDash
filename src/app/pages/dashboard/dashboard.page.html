<app-page-layout title="Dashboard">
  <app-hero-carousel [slides]="heroSlides"></app-hero-carousel>

  <div class="products-section-header">
    <h2>Featured Products</h2>
    <a routerLink="/products" class="products-see-all">See All</a>
  </div>

  <div class="products-grid">
    <div class="product-tile" *ngFor="let product of featuredProducts()">
      <div class="product-tile-photo">
        <img *ngIf="product.photo" [src]="product.photo" [alt]="product.name" />
      </div>
      <div class="product-tile-info">
        <h3>{{ product.name }}</h3>
        <p class="product-tile-price">{{ product.price }}</p>
        <p class="product-tile-desc">{{ product.description }}</p>
      </div>
    </div>
  </div>
</app-page-layout>
