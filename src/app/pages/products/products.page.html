<app-page-layout
  title="List of Products"
  eyebrow="CATALOG"
  description="Browse and manage your product line."
>
  <ion-searchbar
    class="product-search"
    placeholder="Search products..."
    [value]="searchQuery"
    (ionInput)="handleSearch($event)"
  ></ion-searchbar>

  <div class="products-section-header">
    <h2>Featured Products</h2>
  </div>

  <div class="products-grid">
    <div class="product-tile" *ngFor="let product of filteredProducts">
      <div class="product-tile-photo">
        <img *ngIf="product.photo" [src]="product.photo" [alt]="product.name" />
      </div>
      <div class="product-tile-info">
        <h3>{{ product.name }}</h3>
        <p class="product-tile-price">{{ product.price }}</p>
        <p class="product-tile-desc">{{ product.description }}</p>
      </div>
    </div>
  </div>
</app-page-layout>
